[pytest]
addopts = -v -s --tb=short --strict-markers --durations=10 --alluredir=reports
markers =
    smoke: Critical path scenarios
    regression: Full regression suite
    negative: Error handling scenarios
    slow: Tests that take longer than average
    customer: Customer domain tests
    payment: Payment domain tests
    refund: Refund domain tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution settings (can be overridden via CLI)
# -n auto: Use number of CPUs available
# --reruns 2: Retry failed tests 2 times
# --reruns-delay 1: Wait 1 second between reruns
