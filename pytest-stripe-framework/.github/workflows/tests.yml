name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/stripe-tests:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/stripe-tests:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/stripe-tests:buildcache,mode=max

    - name: Run Tests
      run: |
        docker run --rm \
          -e STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }} \
          -e STRIPE_BASE_URL=https://api.stripe.com/v1 \
          -e TIMEOUT=30 \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          ${{ secrets.DOCKER_USERNAME }}/stripe-tests:latest

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results
        retention-days: 7
